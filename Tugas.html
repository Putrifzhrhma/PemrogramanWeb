<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Paw</title>

<!-- ICON (Font Awesome) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    /* BACKGROUND GRADIENT GERAK */
    body {
        background: linear-gradient(-45deg, #0f172a, #1e3a8a, #1e40af, #0ea5e9);
        background-size: 400% 400%;
        animation: gradientMove 10s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    @keyframes gradientMove {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    .container {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(14px);
        padding: 30px;
        border-radius: 20px;
        width: 350px;
        text-align: center;
        box-shadow: 0 0 25px rgba(30, 58, 138, 0.6);
        animation: fadeIn 1s ease;
    }
    .profile-img {
        width: 95px;
        height: 95px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #60a5fa;
        margin-bottom: 15px;
        box-shadow: 0 0 12px #60a5fa;
    }

    h1 {
        color: #fff;
        font-size: 24px;
        text-shadow: 0 0 10px rgba(96,165,250,0.8);
    }

    .desc {
        color: #dbeafe;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 12px;
        text-decoration: none;
        color: #fff;
        font-weight: bold;
        transition: 0.25s;
    }

    .btn i {
        font-size: 18px;
    }

    .btn:hover {
        transform: translateY(-3px) scale(1.02);
    }

    .btn-purple {
        background: linear-gradient(90deg, #6366f1, #4f46e5);
    }

    .btn-black {
        background: #020617;
        border: 1px solid #60a5fa;
    }

    .btn-pink {
        background: linear-gradient(135deg, #fb7185, #f43f5e);
    }

    .btn-green {
        background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .section-title {
        color: #fff;
        margin: 22px 0 12px;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 0 0 8px rgba(96,165,250,0.6);
    }

    .video {
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    .video img {
        width: 100%;
    }

    .footer-text {
        color: #dbeafe;
        font-size: 13px;
        margin-top: 10px;
    }

</style>
</head>

<body>

<div class="container">

    <img src="Poto kecil ak.JPG" class="profile-img">

    <h1>Hola! Aku Paw</h1>
    <p class="desc">Suka Musik | Suka Cilung | Suka Hahahihi</p>

    <a href="https://github.com/Putrifzhrhma" target="_blank" class="btn btn-purple">
        <i class="fa-brands fa-github"></i> GitHub
    </a>

    <a href="https://www.tiktok.com/@caluryous" target="_blank" class="btn btn-black">
        <i class="fa-brands fa-tiktok"></i> TikTok
    </a>

    <a href="https://instagram.com/putrifzhrhma" target="_blank" class="btn btn-pink">
        <i class="fa-brands fa-instagram"></i> Instagram
    </a>

    <a href="https://wa.me/6289532" target="_blank" class="btn btn-green">
        <i class="fa-brands fa-whatsapp"></i> WhatsApp
    </a>

    <div class="section-title">Lets be friend!! 💙</div>

    <div class="video">
        <img src="image.png">
    </div>

    <p class="footer-text">Doain biar bisa ke Cappadocia ✈️</p>
    <p class="footer-text">Nice to meet you guys, thank u :c</p>

</div>

</body>
</html>
